[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-factory"
version = "1.10.0"
description = "Supervisor-driven local AI course factory"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "python-pptx>=1.0,<2",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
chroma = ["chromadb>=0.5,<2"]
docx = ["python-docx>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["course_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
course-factory = "course_factory.__main__:main"
